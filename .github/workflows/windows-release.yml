# Project: classifyimages
# Version: 1.0.0
# Date:    2026-10-03
# Author:  Rohin Gosling
# Build the portable Windows executable and publish verified version tags.

name: Windows executable

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-executable-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows x64
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $projectMetadata = Get-Content -LiteralPath pyproject.toml -Raw
          $projectVersion  = [regex]::Match( $projectMetadata, '(?m)^version\s*=\s*"([^"]+)"' ).Groups[ 1 ].Value
          $packageMetadata = Get-Content -LiteralPath src/classifyimages/__init__.py -Raw
          $packageVersion  = [regex]::Match( $packageMetadata, '(?m)^__version__\s*=\s*"([^"]+)"' ).Groups[ 1 ].Value
          if ( -not $projectVersion -or $env:RELEASE_TAG -cne "v$projectVersion" -or $packageVersion -cne $projectVersion )
          {
              throw "Release tag and package version must match v$projectVersion from pyproject.toml."
          }

      - name: Install build dependencies
        run: |
          python -m venv .venv
          if ( $LASTEXITCODE -ne 0 )
          {
              throw 'Virtual environment creation failed.'
          }
          & .\.venv\Scripts\python.exe -m pip install -r requirements.txt
          if ( $LASTEXITCODE -ne 0 )
          {
              throw 'Dependency installation failed.'
          }
          & .\.venv\Scripts\python.exe -m pip check
          if ( $LASTEXITCODE -ne 0 )
          {
              throw 'Dependency validation failed.'
          }

      - name: Build one-file executable
        shell: cmd
        env:
          CLASSIFYIMAGES_SKIP_PAUSE: '1'
        run: call build.bat

      - name: Verify bundled payload and isolated execution
        run: |
          & .\.venv\Scripts\python.exe .github/scripts/verify_executable.py dist/imageclassifier.exe --model models/mobilenet_v3_small.onnx
          if ( $LASTEXITCODE -ne 0 )
          {
              throw 'Executable verification failed.'
          }

      - name: Write SHA-256 checksum
        run: |
          $executableHash = ( Get-FileHash -LiteralPath dist/imageclassifier.exe -Algorithm SHA256 ).Hash.ToLowerInvariant()
          "$executableHash  imageclassifier.exe" | Set-Content -LiteralPath dist/imageclassifier.exe.sha256 -Encoding ascii

      - name: Save verified executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: imageclassifier-windows-x64
          path: |
            dist/imageclassifier.exe
            dist/imageclassifier.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download verified executable
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: imageclassifier-windows-x64
          path: release

      - name: Publish executable and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          $expectedHash = ( Get-Content -LiteralPath release/imageclassifier.exe.sha256 ).Split( ' ' )[ 0 ]
          $actualHash   = ( Get-FileHash -LiteralPath release/imageclassifier.exe -Algorithm SHA256 ).Hash.ToLowerInvariant()
          if ( $actualHash -cne $expectedHash )
          {
              throw 'Downloaded executable does not match its checksum.'
          }

          @"
          Portable Windows x64 image classifier.

          Download imageclassifier.exe and run it from PowerShell. No Python installation or model download is required.

          Source commit: $env:SOURCE_COMMIT
          Verified build: $env:WORKFLOW_URL
          SHA-256: $actualHash
          "@ | Set-Content -LiteralPath release-notes.md -Encoding utf8

          $existingRelease = gh release view $env:RELEASE_TAG --json isDraft 2>$null
          if ( $LASTEXITCODE -eq 0 )
          {
              if ( -not ( $existingRelease | ConvertFrom-Json ).isDraft )
              {
                  throw 'This release is already published. Use a new version tag; published assets are never replaced.'
              }
          }
          else
          {
              gh release create $env:RELEASE_TAG --verify-tag --draft --title "Image File Classifier $env:RELEASE_TAG" --notes-file release-notes.md
              if ( $LASTEXITCODE -ne 0 )
              {
                  throw 'Draft release creation failed.'
              }
          }

          gh release upload $env:RELEASE_TAG release/imageclassifier.exe release/imageclassifier.exe.sha256 --clobber
          if ( $LASTEXITCODE -ne 0 )
          {
              throw 'Release asset upload failed; the release remains a draft.'
          }
          gh release edit $env:RELEASE_TAG --draft=false --notes-file release-notes.md
          if ( $LASTEXITCODE -ne 0 )
          {
              throw 'Release publication failed.'
          }
